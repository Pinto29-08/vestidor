<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sube fotos de tu ropa y Vestidor te dice qué combinaciones elegantes puedes armar.">
<meta name="theme-color" content="#F2F0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vestidor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.__VESTIDOR_PWA__=true</script>
<title>Vestidor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: revista de bolsillo. Mancheta fija arriba, una columna de contenido (máx. 760px), barra de pestañas abajo.
   Las prendas son fichas cuadradas; cada look es un tablero tipo flat-lay con su nota en numerales Bodoni. */
:root{
  --bg:#F2F0F3; --surface:#FFFFFF; --sunk:#E8E4EA; --ink:#1C1820; --muted:#6A6371; --line:#DCD6DF;
  --accent:#7A1E3A; --accent-ink:#FFFFFF; --accent-soft:#F4E3E8;
  --gold:#8A6A22; --good:#2B6E4E; --warn:#9A5716; --scrim:rgba(20,14,22,.46); --tile:#FFFFFF;
  --shadow:0 1px 2px rgba(28,24,32,.06),0 10px 28px rgba(28,24,32,.08);
  --f-display:"Bodoni Moda","Bodoni 72",Didot,"Bodoni MT","Times New Roman",serif;
  --f-body:"Jost",Futura,"Avenir Next","Century Gothic","Segoe UI",system-ui,sans-serif;
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151317; --surface:#1F1C22; --sunk:#2A262E; --ink:#EFEBF1; --muted:#A79FAD; --line:#38323D;
    --accent:#E8899F; --accent-ink:#260F18; --accent-soft:#3B2129;
    --gold:#D8B460; --good:#78C9A0; --warn:#E6A65C; --scrim:rgba(0,0,0,.62); --tile:#3C3742; --tile:#3C3742;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151317; --surface:#1F1C22; --sunk:#2A262E; --ink:#EFEBF1; --muted:#A79FAD; --line:#38323D;
  --accent:#E8899F; --accent-ink:#260F18; --accent-soft:#3B2129;
  --gold:#D8B460; --good:#78C9A0; --warn:#E6A65C; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.005em}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:500 11px/1.25 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Mancheta */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .mast{background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
}
.mast-in{max-width:760px;margin:0 auto;padding:11px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font-family:var(--f-display);font-weight:500;font-size:25px;letter-spacing:.22em;text-transform:uppercase;line-height:1;font-variation-settings:"opsz" 96;white-space:nowrap}
.issue{font:500 10.5px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right}

/* Estructura */
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:20px;min-width:0}
.v-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.v-head h2{font-size:34px;line-height:1.02}
.v-head .eyebrow{margin-bottom:6px}
.sec{display:grid;gap:12px;min-width:0}
.sec > h2{font-size:25px;line-height:1.1}
.sec > p{max-width:62ch}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;line-height:1.1;white-space:nowrap;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-danger{color:var(--accent);border-color:var(--accent)}
.btn-danger.armed{background:var(--accent);color:var(--accent-ink)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:18px;height:18px}

/* Chips y segmentados */
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.flow{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;line-height:1}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .dot{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:36px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

/* Clóset */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:16px 12px}
.g-card{display:grid;gap:7px;align-content:start;text-align:left;background:none;border:0;padding:0;min-width:0}
.g-img{position:relative;display:block;aspect-ratio:1;width:100%;max-width:100%;border-radius:14px;overflow:hidden;background:var(--sunk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-img{background:var(--tile)}}
:root[data-theme="dark"] .g-img{background:var(--tile)}
.g-img img{width:100%;height:100%;object-fit:cover;display:block}
.g-img svg{display:block;width:100%;height:100%;padding:12%}
.g-name{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag-sample{position:absolute;top:6px;left:6px;font:600 9px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:var(--surface);color:var(--muted);padding:4px 6px;border-radius:999px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
.note.soft{background:var(--accent-soft);border-color:transparent}
.note h3{font-size:21px;line-height:1.15}
.note .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{display:grid;justify-items:center;text-align:center;gap:12px;padding:32px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.empty svg.big{width:56px;height:56px;color:var(--muted)}
.empty h3{font-size:24px}
.empty p{max-width:40ch;color:var(--muted)}

/* Looks */
.looks{display:grid;gap:18px}
@media (min-width:700px){.looks{grid-template-columns:1fr 1fr;align-items:start}}
.look{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0;animation:rise .35s ease both}
.board{display:grid;grid-template-columns:3fr 2fr;gap:8px;padding:10px;background:var(--sunk)}
.board .col{display:grid;gap:8px;align-content:start;min-width:0}
.tile{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:6/5;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--tile)}
.tile.tall{aspect-ratio:6/10.15}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile svg{width:100%;height:100%;display:block;padding:8%}
.tile.add{border:1.5px dashed var(--line);background:transparent;display:grid;place-items:center;align-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
.tile.add svg{width:22px;height:22px;padding:0}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.accs .tile{border-radius:10px;aspect-ratio:1}
.accs .tile svg{padding:12%}
.look-body{padding:16px;display:grid;gap:12px}
.look-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.look-title{font-size:23px;line-height:1.08}
.look-sub{margin-top:6px}
.nota{text-align:right;flex:none}
.nota b{display:block;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:46px;line-height:.82;color:var(--accent);font-variant-numeric:lining-nums;font-variation-settings:"opsz" 96}
.nota span{font:500 10px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;align-items:center}
.swatches i{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);margin-left:-5px;box-shadow:0 0 0 1px var(--line)}
.swatches i:first-child{margin-left:0}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;line-height:1.45}
.reasons li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.reasons svg{width:16px;height:16px;margin-top:2px;color:var(--good)}
.reasons li.w svg{color:var(--warn)}
.tip{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;font-size:14px}
.tip .eyebrow{color:var(--gold)}
.look-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted)}
.ai-why{font-size:15px;line-height:1.55}

/* Barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.03em;padding:6px 0;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-add{color:var(--ink)}
.tab-add .plus{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:-22px}
.tab-add .plus svg{width:24px;height:24px}

/* Hoja inferior */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:640px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:22px;line-height:1.1}
.sheet-body{overflow-y:auto;padding:18px 16px;display:grid;gap:24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
.sheet-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.sheet-foot .btn{flex:1;min-width:0}
.field{display:grid;gap:10px;min-width:0}
.field > .eyebrow{color:var(--ink)}
.err{color:var(--accent);font-size:13px;font-weight:500}
.input{width:100%;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.input::placeholder{color:var(--muted)}

.photo-drop{display:grid;place-items:center;align-content:center;gap:8px;aspect-ratio:4/3;width:100%;max-width:100%;border:1.5px dashed var(--line);border-radius:18px;background:var(--surface);text-align:center;padding:16px;cursor:pointer}
.photo-drop svg{width:36px;height:36px;color:var(--accent)}
.photo-drop b{font-weight:500;font-size:17px}
.photo-prev{position:relative;border-radius:18px;overflow:hidden;background:var(--sunk);width:100%;max-width:100%;height:min(62vw,340px)}
.photo-prev img{width:100%;height:100%;object-fit:contain;display:block;cursor:crosshair}
.photo-prev .pick{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.photo-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.types{display:grid;gap:14px}
.type-grp{display:grid;gap:8px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.type-opt{display:grid;justify-items:center;align-content:start;gap:4px;padding:8px 4px 9px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;line-height:1.2;text-align:center;min-width:0}
.type-opt svg{width:42px;height:42px}
.type-opt[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:10px}
.sw{aspect-ratio:1;width:100%;max-width:100%;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.sw.metal{background-image:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,0) 60%)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:rise .25s ease}

/* Ideas */
.stat{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.stat .big{font-family:var(--f-display);font-size:72px;line-height:.82;font-style:italic;color:var(--accent);font-variant-numeric:lining-nums;font-variation-settings:"opsz" 96}
.stat p{max-width:28ch;padding-bottom:4px}
.occ-tbl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.occ-tbl div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 8px;display:grid;gap:2px;align-content:start;min-width:0}
.occ-tbl b{font-family:var(--f-display);font-size:24px;font-weight:500;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.occ-tbl span{font-size:11.5px;line-height:1.25;color:var(--muted)}
@media (min-width:560px){.occ-tbl b{font-size:30px}.occ-tbl span{font-size:12.5px}.occ-tbl div{padding:10px 12px}}
.buys{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.buy{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.buy:first-child{border-top:0}
.buy .g-img{border-radius:12px}
.buy .g-img svg{padding:10%}
.buy b{font-weight:500;display:block}
.buy p{font-size:13px;color:var(--muted);line-height:1.4}
.badge{font:600 12px/1 var(--f-body);background:var(--accent-soft);color:var(--accent);padding:7px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.palette-bar{display:flex;height:22px;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.palette-bar i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.rules{display:grid;gap:10px}
@media (min-width:620px){.rules{grid-template-columns:1fr 1fr}}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.rule h3{font-size:18px;line-height:1.2}
.rule p{font-size:14px;color:var(--muted)}
.rule .sws{display:flex;gap:4px;margin-bottom:4px}
.rule .sws i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}

/* Estilista */
.stylist{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stylist form{display:flex;gap:8px}
.stylist h3{font-size:20px}
.thinking{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}

.set-list{display:grid;gap:12px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}

@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <h1 class="wordmark">Vestidor</h1>
    <p class="issue" id="issue">Tu estilista de bolsillo</p>
  </div>
</header>

<main class="wrap">
  <section id="v-closet" class="view" aria-label="Tu clóset"></section>
  <section id="v-combine" class="view" aria-label="Combinar" hidden></section>
  <section id="v-ideas" class="view" aria-label="Ideas" hidden></section>
  <section id="v-settings" class="view" aria-label="Ajustes" hidden></section>
</main>

  [pairKey('beige','crema')]: 'Beige y crema tan juntos se confunden; separa con un tono más oscuro.',
  [pairKey('cafe','negro')]: 'Café y negro juntos: en lo casual pasa, en lo formal mejor elige uno.'
};
const CLASH = {
  [pairKey('rojo','verde')]: 'Rojo y verde juntos recuerdan a la Navidad; cambia uno por un neutro.'
};

function harmony(k1, k2){
  const key = pairKey(k1, k2);
  if (CLASH[key]) return {s:-12, txt:CLASH[key]};
  const a = PAL[k1], b = PAL[k2], A = cap(cn(k1)), B = cn(k2);
  const d = hueDist(a.hsl[0], b.hsl[0]);
  const softA = a.kind === 'earth' || a.hsl[1] < 0.45 || a.hsl[2] > 0.72;
  const softB = b.kind === 'earth' || b.hsl[1] < 0.45 || b.hsl[2] > 0.72;
  const soft = softA || softB;
  if (a.kind === 'earth' && b.kind === 'earth') return {s:8, txt:`${A} y ${B}: tonos tierra que se entienden solos.`};
  if (a.hsl[2] > 0.68 && b.hsl[2] > 0.68) return {s:8, txt:`${A} y ${B}: pasteles juntos, suave y fresco.`};
  if (d <= 40) return {s: soft ? 8 : 4, txt:`${A} y ${B} son vecinos en el círculo cromático: armonía natural.`};
  if (d <= 90) return {s: soft ? 5 : 0, txt:`${A} y ${B} conviven bien por ser tonos cercanos.`};
  if (d >= 130) return {s: soft ? 7 : 3, txt:`${A} y ${B} son complementarios: contraste con carácter.`};
  if (softA && softB) return {s:2, txt:`${A} y ${B} en tonos suaves conviven sin pelear.`};
  if (soft) return {s:-3, txt:`${A} y ${B} no terminan de combinar; un neutro entre ambos ayuda.`};
  return {s:-10, txt:`${A} y ${B} chocan entre sí; deja uno y cambia el otro por un neutro.`};
}

/* ---------- Motor de combinaciones ---------- */
const C = it => PAL[it.color] || PAL.gris;
const Lk = it => C(it).lab[0];
function itemRange(it){ const T = TYPES[it.type]; const s = it.shift || 0; return [clamp(T.f[0] + s, 1, 5), clamp(T.f[1] + s, 1, 5)]; }
function formDist(it, t){ const [a, b] = itemRange(it); return t < a ? a - t : t > b ? t - b : 0; }
const seasonOf = it => it.season || TYPES[it.type].season || 'all';
function weatherPen(it, w){
  const s = seasonOf(it), T = TYPES[it.type];
  if (w === 'calor' && s === 'cold') return 14;
  if (w === 'frio' && s === 'hot') return (T.slot === 'bottom' || T.slot === 'shoes') ? 16 : 10;
  return 0;
}
const wornRecently = it => Array.isArray(it.worn) && it.worn.some(d => daysAgo(d) <= 2);
function mkCtx(occ, w){ return {occ, t: OCC[occ].t, w}; }

function mkR(){
  const g = [], w = [];
  return {
    good(t, wt){ if (!g.some(x => x.t === t)) g.push({t, wt: wt || 1}); },
    warn(t){ if (!w.includes(t)) w.push(t); },
    goods(){ return g.slice().sort((a, b) => b.wt - a.wt).slice(0, 3).map(x => x.t); },
    warns(){ return w.slice(0, 2); }
  };
}

function scoreCore(o, ctx, R){
  const t = ctx.t, w = ctx.w;
  let s = 60;
  const core = [o.top, o.bottom, o.dress, o.outer, o.shoes].filter(Boolean);
  let worst = null, wd = 0;
  for (const it of core){
    const d = formDist(it, t);
    if (d){ s -= d === 1 ? 9 : 22; if (d > wd){ wd = d; worst = it; } }
    const p = weatherPen(it, w);
    if (p){ s -= p; if (R){ const T = TYPES[it.type]; R.warn(`${art(T,true)} ${tn(T)} no ${T.p ? 'son ideales' : 'es ideal'} para el ${w === 'calor' ? 'calor' : 'frío'}.`); } }
  }
  if (R){
    if (!worst) R.good(`Todas las piezas están al mismo nivel de formalidad, justo para «${OCC[ctx.occ].n.toLowerCase()}».`, 1);
    else { const T = TYPES[worst.type]; const casual = itemRange(worst)[1] < t; R.warn(`${art(T,true)} ${tn(T)} ${T.p ? 'quedan' : 'queda'} un poco ${casual ? (T.p ? 'casuales' : 'casual') : (T.p ? 'formales' : 'formal')} para la ocasión.`); }
  }
  if (o.outer){
    const ot = o.outer.type;
    if (w === 'calor'){ if (ot === 'chaqueta' || ot === 'abrigo') s -= 8; else if (t <= 2) s -= 5; }
    else if (w === 'frio'){ s += 3; if (R) R.good('Una capa encima: abriga y le da estructura al look.', 1); }
    else s += 1;
  } else if (w === 'frio' && !(o.top && TYPES[o.top.type].warm)){
    s -= 8; if (R) R.warn('Hace frío: suma una chaqueta, un cárdigan o un suéter.');
  }
  if (o.outer && o.outer.type === 'blazer' && t <= 3 && ((o.top && o.top.type === 'camiseta') || (o.bottom && o.bottom.type === 'jeans'))){
    s += 4; if (R) R.good('Blazer con piezas casuales: el truco smart casual para verse arreglado sin esfuerzo.', 4);
  }
  if (t >= 5 && o.top && !o.outer){ s -= 7; if (R) R.warn('En un evento formal, completa con saco o blazer.'); }
  else if (t >= 4 && o.outer && (o.outer.type === 'blazer' || o.outer.type === 'abrigo')){ s += t >= 5 ? 4 : 3; if (R) R.good(t >= 5 ? 'Saco o blazer: la base de la etiqueta formal.' : 'El blazer le da estructura y autoridad al look de oficina.', 2); }
  s += colorScore(o, ctx, R);
  s += patternScore(o, R);
  s += shoeScore(o, ctx, R);
  return s;
}

function colorScore(o, ctx, R){
  let s = 0; const t = ctx.t;
  const big = [o.outer, o.dress || o.top, o.dress ? null : o.bottom].filter(Boolean);
  const withShoes = o.shoes ? big.concat([o.shoes]) : big;
  const chrom = [...new Set(withShoes.filter(it => isChromK(it.color)).map(it => it.color))];
  const n = chrom.length;
  if (n === 0){ s += 6; if (R) R.good('Paleta neutra: sobria, elegante y fácil de llevar.', 2); }
  else if (n === 1){ s += 12; if (R) R.good(`Base neutra con un solo acento de color (${cn(chrom[0])}): fórmula infalible.`, 4); }
  else if (n === 2){ const hm = harmony(chrom[0], chrom[1]); s += hm.s; if (R){ if (hm.s > 0) R.good(hm.txt, 3); else R.warn(hm.txt); } }
  else {
    let worst = 99;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) worst = Math.min(worst, harmony(chrom[i], chrom[j]).s);
    s -= 8 + 7 * (n - 3) + (worst < 0 ? 6 : 0);
    if (R) R.warn(`Hay ${n} colores compitiendo; deja uno o dos y el resto en neutros.`);
  }
  let cl = null;
  for (let i = 0; i < big.length && !cl; i++) for (let j = i + 1; j < big.length; j++){
    const k = pairKey(big[i].color, big[j].color); if (CLASSIC[k]){ cl = CLASSIC[k]; break; }
  }
  if (cl){ s += 5; if (R) R.good(cl.txt, 5); }
  const adj = [];
  if (o.top && o.bottom) adj.push([o.top, o.bottom]);
  if (o.outer){ if (o.bottom) adj.push([o.outer, o.bottom]); if (o.top) adj.push([o.outer, o.top]); if (o.dress) adj.push([o.outer, o.dress]); }
  for (const [a, b] of adj){
    if (a.color === b.color) continue;
    const k = pairKey(a.color, b.color), nm = NEAR[k];
    if (!nm) continue;
    if (k === pairKey('cafe','negro')){ if (t >= 4){ s -= 6; if (R) R.warn(nm); } else s -= 1; }
    else { s -= 6; if (R) R.warn(nm); }
  }
  if (o.top && o.bottom){
    if (o.top.color === o.bottom.color){
      const k = o.top.color;
      if (k === 'mezclilla'){ s -= 4; if (R) R.warn('Mezclilla con mezclilla del mismo tono se ve plano; combina tonos distintos.'); }
      else if (k === 'negro'){ s += (ctx.occ === 'fiesta' || t >= 4) ? 6 : 3; if (R) R.good('Total black: estiliza y nunca falla.', 4); }
      else if (!isChromK(k)){ s += 3; if (R) R.good(`Monocromo en ${cn(k)}: alarga la silueta y se ve pensado.`, 3); }
      else { s += 1; if (R) R.good(`Total look en ${cn(k)}: atrevido y con intención.`, 2); }
    } else if (Math.abs(Lk(o.top) - Lk(o.bottom)) >= 35){
      s += 4; if (R) R.good('Buen contraste claro–oscuro entre arriba y abajo.', 2);
    }
  }
  const loud = withShoes.filter(it => isVivid(C(it)));
  if (ctx.occ === 'oficina' && loud.length){ s -= 3 * loud.length; if (R) R.warn('Para la oficina conviene un solo color intenso y, mejor, en una pieza pequeña.'); }
  if (ctx.occ === 'formal' && n >= 2) s -= 4;
  if (ctx.occ === 'fiesta'){
    const base = o.dress || o.bottom;
    if (base && Lk(base) < 35){ s += 3; if (R) R.good('Base oscura: ideal para la noche.', 2); }
    if (loud.length === 1) s += 2;
  }
  if (ctx.occ === 'cita' && n === 1) s += 2;
  if (t >= 4 && o.shoes && TYPES[o.shoes.type].leather && (o.shoes.color === 'cafe' || o.shoes.color === 'camel') &&
      ((o.bottom && o.bottom.color === 'negro') || (o.outer && o.outer.color === 'negro'))){
    s -= 6; if (R) R.warn('En lo formal, con negro van zapatos negros, no café.');
  }
  return s;
}

function patternScore(o, R){
  const big = [o.outer, o.dress || o.top, o.dress ? null : o.bottom].filter(Boolean);
  const pats = big.filter(it => it.pattern && it.pattern !== 'liso');
  if (!pats.length) return 0;
  if (pats.length === 1){ if (R) R.good(`Un solo estampado (${PAT[pats[0].pattern].toLowerCase()}) como protagonista; lo demás liso.`, 3); return 4; }
  const ps = pats.map(p => p.pattern);
  if (pats.length === 2){
    if (ps.includes('animal')){ if (R) R.warn('El animal print pide ser el único estampado del look.'); return -16; }
    if (ps[0] === ps[1]){ if (R) R.warn('Dos piezas con el mismo estampado compiten; deja una lisa.'); return -12; }
    if (ps.includes('rayas') && (ps.includes('cuadros') || ps.includes('lunares') || ps.includes('floral'))){
      if (R) R.warn('Mezcla de estampados: funciona si uno es grande y el otro fino, y comparten un color.'); return -6;
    }
    if (R) R.warn('Dos estampados a la vez recargan el look.'); return -12;
  }
  if (R) R.warn('Demasiados estampados juntos.'); return -30;
}

function shoeScore(o, ctx, R){
  const sh = o.shoes; if (!sh) return 0;
  let s = 0; const t = ctx.t;
  if (!isChromK(sh.color)) s += 2;
  else {
    const others = [o.top, o.bottom, o.dress, o.outer].filter(Boolean).map(it => it.color);
    if (others.includes(sh.color)){ s += 4; if (R) R.good('Los zapatos repiten un color del look: se ve intencional.', 3); }
  }
  if (sh.type === 'tenis' && sh.color === 'blanco' && ['casual','cita','relax'].includes(ctx.occ)){ s += 3; if (R) R.good('Tenis blancos: el comodín moderno.', 2); }
  if (ctx.occ === 'fiesta'){
    if (sh.type === 'tacones'){ s += 4; if (R) R.good('Tacones: elevan cualquier look de noche.', 2); }
    else if (TYPES[sh.type].leather) s += 2;
    else if (sh.type === 'tenis' || sh.type === 'sandalias'){ s -= 3; if (R) R.warn('Para una fiesta, un calzado más arreglado luce mejor que unos tenis o sandalias.'); }
  }
  if (t >= 4 && o.bottom && sh.type !== 'tacones' && sh.type !== 'bailarinas' && Lk(sh) - Lk(o.bottom) > 25){
    s -= 4; if (R) R.warn('En lo formal, los zapatos van más oscuros que el pantalón.');
  }
  return s;
}

const SUBS = ['belt','tie','watch','bag','jewel','jewel','scarf','eyewear','hat'];
function accScore(a, o, ctx, chosen, R){
  const T = TYPES[a.type], t = ctx.t; let v = 0;
  const d = formDist(a, t); if (d >= 2) return -50; if (d === 1) v -= 4;
  const wp = weatherPen(a, ctx.w); if (wp >= 14) return -50; v -= wp;
  switch (T.sub){
    case 'belt': {
      const b = o.bottom; if (!b || !TYPES[b.type].loops) return -50;
      v += t >= 3 ? 3 : 1;
      const sh = o.shoes;
      if (sh && TYPES[sh.type].leather){
        const fa = leather(a.color), fs = leather(sh.color);
        if (a.color === sh.color){ v += t >= 3 ? 5 : 2; if (R) R.good('Cinturón y zapatos del mismo tono: detalle de buen gusto.', 4); }
        else if (fa && fs && fa !== fs){ v -= t >= 3 ? 8 : 3; if (R) R.warn('Cinturón y zapatos en distinto cuero (negro y café): mejor iguálalos.'); }
        else if (fa && fa === fs) v += 2;
      }
      break;
    }
    case 'tie': {
      if (!o.top || o.top.type !== 'camisa') return -50;
      v += t >= 5 ? 7 : t >= 4 ? 2 : -8;
      if (a.color === o.top.color) v -= 5;
      break;
    }
    case 'watch': v += t >= 2 ? 2 : 1; break;
    case 'bag': v += t >= 2 ? 2 : 1; if (o.shoes && a.color === o.shoes.color){ v += 2; if (R) R.good('Bolso a juego con los zapatos.', 2); } break;
    case 'jewel': {
      v += t <= 1 ? -3 : ctx.occ === 'fiesta' ? 3 : t >= 3 ? 2 : 1;
      const metals = chosen.filter(x => x !== a && PAL[x.color] && PAL[x.color].kind === 'metal').map(x => x.color);
      if (C(a).kind === 'metal' && metals.some(m => m !== a.color)){ v -= 5; if (R) R.warn('Dorado y plateado juntos restan armonía; elige un solo metal.'); }
      break;
    }
    case 'scarf': v += ctx.w === 'frio' ? 4 : ctx.w === 'templado' ? 1 : -50; break;
    case 'eyewear': v += (ctx.w === 'calor' && (ctx.occ === 'casual' || ctx.occ === 'relax')) ? 2 : -50; break;
    case 'hat': v += t <= 2 ? 1 : -50; break;
  }
  if (v <= -50) return v;
  const ck = a.color;
  if (isChromK(ck)){
    const core = new Set([o.outer, o.dress || o.top, o.dress ? null : o.bottom, o.shoes].filter(Boolean).map(i => i.color).filter(isChromK));
    for (const x of chosen) if (x !== a && isChromK(x.color)) core.add(x.color);
    const list = [...core];
    if (core.has(ck)){ v += 4; if (R) R.good(`${art(T,true)} ${tn(T)} ${T.p ? 'repiten' : 'repite'} el ${cn(ck)} del look: se ve intencional.`, 3); }
    else if (!list.length){ v += 3; if (R) R.good(`El toque de color va en ${art(T)} ${tn(T)}: personalidad sin exagerar.`, 3); }
    else {
      let worst = 99; for (const k of list) worst = Math.min(worst, harmony(k, ck).s);
      if (list.length >= 2) v -= 5;
      v += worst < 0 ? -10 : worst >= 6 ? 1 : -1;
    }
  }
  return v;
}

function addAccessories(o, ctx, accs, forced){
  const chosen = []; let s = 0;
  if (forced){ s += Math.max(accScore(forced, o, ctx, chosen, null), -30); chosen.push(forced); }
  const used = new Set(chosen.map(a => TYPES[a.type].sub));
  let jewels = chosen.filter(a => TYPES[a.type].sub === 'jewel').length;
  const maxAcc = ctx.t <= 2 ? 3 : 4;
  for (const sub of SUBS){
    if (chosen.length >= maxAcc) break;
    if (sub === 'jewel'){ if (jewels >= 2) continue; } else if (used.has(sub)) continue;
    let best = null, bv = 0;
    for (const a of accs){
      if (chosen.includes(a) || TYPES[a.type].sub !== sub) continue;
      const v = accScore(a, o, ctx, chosen, null);
      if (v > bv){ bv = v; best = a; }
    }
    if (best){ chosen.push(best); s += bv; used.add(sub); if (sub === 'jewel') jewels++; }
  }
  o.acc = chosen;
  return s;
}

const CAPS = {top:14, bottom:12, dress:10, outer:6, shoes:8, acc:40};
function itemFit(it, ctx, seed){
  return -formDist(it, ctx.t) * 10 - weatherPen(it, ctx.w) - (wornRecently(it) ? 4 : 0) + (seed ? (hashStr(it.id + ':' + seed) % 100) / 100 * 7 : 0);
}
function poolFor(ctx, fixed, seed){
  const g = {top:[], bottom:[], dress:[], outer:[], shoes:[], acc:[]};
  for (const it of state.items){
    const T = TYPES[it.type]; if (!T || it === fixed) continue;
    if (formDist(it, ctx.t) > 1 || weatherPen(it, ctx.w) >= 14) continue;
    g[T.slot].push(it);
  }
  for (const k in g){ g[k].sort((a, b) => itemFit(b, ctx, seed) - itemFit(a, ctx, seed)); g[k] = g[k].slice(0, CAPS[k]); }
  if (fixed){ const sl = TYPES[fixed.type].slot; if (sl === 'acc') g.acc.unshift(fixed); else g[sl] = [fixed]; }
  return g;
}
function buildCores(ctx, g, fixedSlot){
  const out = [];
  const shoesL = g.shoes.length ? g.shoes : [null];
  const outerL = fixedSlot === 'outer' ? g.outer : [null].concat(g.outer);
  if (fixedSlot !== 'dress')
    for (const top of g.top) for (const bottom of g.bottom) for (const shoes of shoesL) for (const outer of outerL){
      const o = {top, bottom, dress:null, outer, shoes, acc:[]}; out.push({o, s: scoreCore(o, ctx, null)});
    }
  if (fixedSlot !== 'top' && fixedSlot !== 'bottom')
    for (const dress of g.dress) for (const shoes of shoesL) for (const outer of outerL){
      const o = {top:null, bottom:null, dress, outer, shoes, acc:[]}; out.push({o, s: scoreCore(o, ctx, null)});
    }
  return out;
}
function lookKey(o){ return [o.top, o.bottom, o.dress, o.outer, o.shoes].concat(o.acc || []).filter(Boolean).map(i => i.id).sort().join(','); }
function overlap(a, b){
  let v = 0;
  if (a.top && a.top === b.top) v += 12; if (a.dress && a.dress === b.dress) v += 14;
  if (a.bottom && a.bottom === b.bottom) v += 9; if (a.shoes && a.shoes === b.shoes) v += 4; if (a.outer && a.outer === b.outer) v += 4;
  return v;
}
const recentPen = o => [o.top, o.bottom, o.dress, o.outer, o.shoes].filter(Boolean).filter(wornRecently).length * 4;

function suggest(ctx, opts){
  opts = opts || {};
  const fixed = opts.fixed || null, limit = opts.limit || 6, seed = opts.seed || 0;
  const g = poolFor(ctx, fixed, seed);
  const fslot = fixed ? TYPES[fixed.type].slot : null;
  let cores = buildCores(ctx, g, fslot === 'acc' ? null : fslot);
  const evaluated = cores.length;
  cores.sort((a, b) => b.s - a.s); cores = cores.slice(0, 90);
  const res = [];
  for (const c of cores){
    const accS = addAccessories(c.o, ctx, g.acc, fslot === 'acc' ? fixed : null);
    const total = c.s + accS;
    const jitter = seed ? ((hashStr(lookKey(c.o) + ':' + seed) % 1000) / 1000 - 0.5) * 10 : 0;
    res.push({o: c.o, total, rank: total + jitter - recentPen(c.o)});
  }
  res.sort((a, b) => b.rank - a.rank);
  const picked = [];
  while (picked.length < limit && res.length){
    let bi = -1, bv = -1e9;
    for (let i = 0; i < res.length; i++){ let v = res[i].rank; for (const p of picked) v -= overlap(res[i].o, p.o); if (v > bv){ bv = v; bi = i; } }
    const r = res.splice(bi, 1)[0];
    if (r.total < 55 && picked.length) break;
    picked.push(r);
  }
  return {evaluated, looks: picked.map(r => { const L = finalize(r.o, ctx); L.fixed = fixed; return L; })};
}

function finalize(o, ctx){
  const R = mkR(); let s = scoreCore(o, ctx, R);
  const chosen = [];
  for (const a of (o.acc || [])){ s += Math.max(accScore(a, o, ctx, chosen, R), -30); chosen.push(a); }
  return {o, ctx, score: s, nota: notaOf(s), title: titleFor(o, ctx), good: R.goods(), warn: R.warns(), tips: tipsFor(o, ctx), key: lookKey(o)};
}

function titleFor(o, ctx){
  const big = [o.outer, o.dress || o.top, o.dress ? null : o.bottom].filter(Boolean);
  const keys = [...new Set(big.map(i => i.color))];
  const chrom = [...new Set(big.concat(o.shoes ? [o.shoes] : []).filter(i => isChromK(i.color)).map(i => i.color))];
  if (o.dress && !o.outer){
    const k = o.dress.color;
    if (k === 'negro') return 'El vestidito negro';
    if (isChromK(k)) return cap(cn(k)) + ' protagonista';
    return 'Sobrio y elegante';
  }
  if (keys.length === 1 && keys[0] === 'negro') return 'Total black';
  if (o.outer && o.outer.type === 'blazer' && ctx.t <= 3 && ((o.top && o.top.type === 'camiseta') || (o.bottom && o.bottom.type === 'jeans'))) return 'Smart casual con blazer';
  for (let i = 0; i < big.length; i++) for (let j = i + 1; j < big.length; j++){ const c = CLASSIC[pairKey(big[i].color, big[j].color)]; if (c) return c.title; }
  if (keys.length === 1 && big.length > 1) return 'Monocromo ' + cn(keys[0]);
  if (chrom.length === 1) return 'Neutros con ' + cn(chrom[0]);
  if (!chrom.length){ const L = big.reduce((a, i) => a + Lk(i), 0) / big.length; return L > 70 ? 'Neutros claros' : L < 35 ? 'Neutros profundos' : 'Clásico neutro'; }
  if (chrom.length === 2) return cap(cn(chrom[0])) + ' y ' + cn(chrom[1]);
  return 'Look con color';
}

function tipsFor(o, ctx){
  const tips = [];
  const acc = o.acc || [];
  if (acc.some(a => a.type === 'corbata')) tips.push('La punta de la corbata debe llegar justo a la hebilla del cinturón.');
  if (o.top && TYPES[o.top.type].tuck && ctx.t >= 3 && o.bottom){
    const T = TYPES[o.top.type];
    tips.push(`Mete ${art(T)} ${tn(T)} por dentro ${o.bottom.type === 'falda' ? 'de la falda' : 'del pantalón'} para marcar la cintura.`);
  }

function notaOf(s){ return s <= 90 ? clamp(s, 0, 90) / 10 : 9 + (s - 90) / (s - 90 + 12); }
function notaLabel(n){ return n >= 9 ? 'Impecable' : n >= 8 ? 'Muy elegante' : n >= 7 ? 'Bien logrado' : n >= 6 ? 'Correcto' : 'Mejorable'; }

function countGood(ctx, fixed, cap){
  if (fixed && (formDist(fixed, ctx.t) > 1 || weatherPen(fixed, ctx.w) >= 14)) return 0;
  const g = poolFor(ctx, fixed, 0); const fs = fixed ? TYPES[fixed.type].slot : null;
  let cores = buildCores(ctx, g, fs === 'acc' ? null : fs).filter(c => c.s >= 50);
  cores.sort((a, b) => b.s - a.s); cores = cores.slice(0, cap || 160);
  const without = fs === 'acc' ? g.acc.filter(a => a !== fixed) : null;
  let n = 0;
  for (const c of cores){
    const o = Object.assign({}, c.o);
    const as = addAccessories(o, ctx, g.acc, fs === 'acc' ? fixed : null);
    if (fs === 'acc'){ const o2 = Object.assign({}, c.o); const before = addAccessories(o2, ctx, without, null); if (c.s + as <= c.s + before) continue; }
    if (c.s + as >= 70) n++;
  }
  return n;
}

function garmentSVG(type, hex, pattern){
  const S = SHAPES[type] || SHAPES.camiseta;
  const L = rgbLab(hexRgb(hex))[0];
  const stroke = L < 28 ? shade(hex, 0.55) : shade(hex, -0.42);
  const selfStroke = L > 88 ? shade(hex, -0.25) : hex;
  const fillOf = (f) => ({shade: shade(hex, L < 28 ? 0.18 : -0.22), shirt: '#F3F1EC', sole: '#2B272A', rubber: '#F4F2EE', tan: '#C8A77C', face: '#F6F5F2', none: 'none'})[f] || hex;
  const strokeOf = (e) => e.sc === 'metal' ? '#A2A5AB' : e.sc === 'self' ? selfStroke : e.f === 'shirt' ? '#C9C4BB' : e.f === 'rubber' ? '#BCB7B0' : e.f === 'tan' ? '#9A7D58' : e.f === 'sole' ? '#2B272A' : stroke;
  let out = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" stroke-linejoin="round" stroke-linecap="round">`;
  if (pattern && pattern !== 'liso' && S.d){
    const id = 'pt' + (++svgSeq);
    const pc = L > 62 ? 'rgba(40,36,48,.45)' : 'rgba(255,255,255,.5)';
    out += `<defs>${patternDef(pattern, id, pc)}</defs>`;
    S._pid = id;
  } else S._pid = null;
  (S.bk || []).forEach(e => { out += `<path d="${e.d}" fill="${fillOf(e.f)}" stroke="${strokeOf(e)}" stroke-width="${e.w || 1.6}"/>`; });
  if (S.d) out += `<path d="${S.d}" fill="${hex}" stroke="${stroke}" stroke-width="1.8"/>`;
  if (S._pid) out += `<path d="${S.d}" fill="url(#${S._pid})"/>`;
  if (S.ell) out += `<ellipse cx="${S.ell[0]}" cy="${S.ell[1]}" rx="${S.ell[2]}" ry="${S.ell[3]}" fill="none" stroke="${selfStroke}" stroke-width="${S.w}"/>`;
  if (S.sm) out += `<path d="${S.sm}" fill="none" stroke="${selfStroke}" stroke-width="${S.w}"/>`;
  (S.ex || []).forEach(e => { out += `<path d="${e.d}" fill="${fillOf(e.f)}" stroke="${strokeOf(e)}" stroke-width="${e.w || 1.6}"/>`; });
  (S.circ || []).forEach(c => { out += `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${fillOf(c[3])}" stroke="${c[4] === 'metal' ? '#A2A5AB' : stroke}" stroke-width="${c[5]}"/>`; });
  if (S.l) out += `<path d="${S.l}" fill="none" stroke="${stroke}" stroke-width="1.4"/>`;
  (S.dots || []).forEach(d => { out += `<circle cx="${d[0]}" cy="${d[1]}" r="${d[2] || 1.3}" fill="${stroke}"/>`; });
  return out + '</svg>';
}

const DB = {
  db: null, ok: false, mem: {items: new Map(), looks: new Map()},
  async open(){
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await Promise.race([
        new Promise((res, rej) => {
          const r = indexedDB.open('vestidor', 1);
          r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', {keyPath:'id'}); if (!d.objectStoreNames.contains('looks')) d.createObjectStore('looks', {keyPath:'id'}); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
      ]);
      this.ok = true;
    } catch (e){ this.ok = false; }
  },
  async all(store){
    if (!this.ok) return [...this.mem[store].values()];
    try {
      return await new Promise((res, rej) => { const q = this.db.transaction(store).objectStore(store).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
    } catch (e){ this.ok = false; return [...this.mem[store].values()]; }
  },
  async put(store, obj){
    this.mem[store].set(obj.id, obj);
    if (!this.ok) return;
    try { await new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).put(obj); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
    catch (e){ storageWarn(); }
  },
  async del(store, id){
    this.mem[store].delete(id);
    if (!this.ok) return;
    try { await new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); } catch (e){}
  },
  async clear(store){
    this.mem[store].clear();
    if (!this.ok) return;
    try { await new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).clear(); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); } catch (e){}
  }
};

    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));

function kmeans(pts, k, iters){
  if (!pts.length) return [];
  k = Math.min(k, pts.length);
  const cents = [pts[0].lab.slice()];
  while (cents.length < k){ let bi = 0, bd = -1; for (let i = 0; i < pts.length; i++){ let md = 1e9; for (const c of cents) md = Math.min(md, dE(c, pts[i].lab)); if (md > bd){ bd = md; bi = i; } } cents.push(pts[bi].lab.slice()); }
  let asg = new Array(pts.length).fill(0);
  for (let it = 0; it < (iters || 8); it++){
    for (let i = 0; i < pts.length; i++){ let bi = 0, bd = 1e9; for (let c = 0; c < k; c++){ const d = dE(cents[c], pts[i].lab); if (d < bd){ bd = d; bi = c; } } asg[i] = bi; }
    const acc = cents.map(() => [0,0,0,0]);
    for (let i = 0; i < pts.length; i++){ const w = pts[i].w, a = acc[asg[i]], l = pts[i].lab; a[0] += l[0]*w; a[1] += l[1]*w; a[2] += l[2]*w; a[3] += w; }
    acc.forEach((a, c) => { if (a[3] > 0) cents[c] = [a[0]/a[3], a[1]/a[3], a[2]/a[3]]; });
  }
  const out = cents.map(c => ({c, wt: 0, n: 0}));
  for (let i = 0; i < pts.length; i++){ out[asg[i]].wt += pts[i].w; out[asg[i]].n++; }
  return out;
}
function detectColors(cv){
  try {
    const N = 56; const s = document.createElement('canvas'); s.width = N; s.height = N;
    const c = s.getContext('2d', {willReadFrequently: true}); c.drawImage(cv, 0, 0, N, N);
    const d = c.getImageData(0, 0, N, N).data; const px = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      const i = (y * N + x) * 4; if (d[i+3] < 128) continue;
      const lab = rgbLab([d[i], d[i+1], d[i+2]]);
      const border = x < 3 || y < 3 || x >= N - 3 || y >= N - 3;
      const dx = (x - N/2) / (N/2), dy = (y - N/2) / (N/2);
      px.push({lab, w: Math.exp(-(dx*dx + dy*dy) * 1.6), border});
    }
    const bpts = px.filter(p => p.border).map(p => ({lab: p.lab, w: 1}));
    const bg = kmeans(bpts, 3, 6).filter(cl => cl.n / bpts.length > 0.18).map(cl => cl.c);
    const inner = px.filter(p => !p.border);
    let fg = inner.filter(p => !bg.some(b => dE(b, p.lab) < 16));
    const tw = inner.reduce((a, p) => a + p.w, 0), fw = fg.reduce((a, p) => a + p.w, 0);
    if (fw < 0.08 * tw) fg = inner;
    const cl = kmeans(fg, 4, 8).sort((a, b) => b.wt - a.wt);
    const out = [];
    for (const k of cl){ const key = nearestColor(k.c, false); if (key && !out.includes(key)) out.push(key); if (out.length >= 3) break; }
    return out;
  } catch (e){ return []; }
}
function colorAt(cv, fx, fy){
  try {
    const c = cv.getContext('2d', {willReadFrequently: true});
    const x = clamp(Math.round(fx * cv.width) - 3, 0, cv.width - 7), y = clamp(Math.round(fy * cv.height) - 3, 0, cv.height - 7);
    const d = c.getImageData(x, y, 7, 7).data; let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
    return nearestColor(rgbLab([r/n, g/n, b/n]), true);
  } catch (e){ return null; }
}

function dataURLtoBlob(u){
  const i = u.indexOf(','); const head = u.slice(0, i), b64 = u.slice(i + 1);

    if (!d.type || !d.color){
      typeErr = !d.type; colorErr = !d.color; renderType(); renderColor();
      (typeErr ? typeSec : colorSec).scrollIntoView({behavior: 'smooth', block: 'start'}); return;
    }
    const it = {id: d.id || uid(), type: d.type, color: d.color, pattern: d.pattern || 'liso', shift: d.shift || 0, season: d.season || TYPES[d.type].season || 'all',
      name: (d.name || '').trim(), created: d.created || Date.now(), worn: d.worn || [], sample: editing ? !!d.sample : false};
    if (d.photoBlob){
      if (d.photoChanged){ it.photo = await blobToBuf(d.photoBlob); it.photoType = d.photoBlob.type || 'image/jpeg'; }
      else if (item){ it.photo = item.photo; it.photoType = item.photoType; }
    }
    if (editing && d.photoChanged) dropURL(it.id);
    let removed = false;
    if (!editing && hasSamples()){ await removeSamples(); removed = true; }
    await DB.put('items', it);
    const idx = state.items.findIndex(x => x.id === it.id);
    if (idx >= 0) state.items[idx] = it; else state.items.push(it);
    if (editing && state.fixed && state.fixed.id === it.id) state.fixed = it;
    markDirty();
    if (!editing && queue.length){
      toast((removed ? 'Quitamos los ejemplos. ' : '') + 'Guardada: ' + itemName(it));
      Object.assign(d, {id: null, type: null, color: null, pattern: 'liso', shift: 0, season: null, name: '', worn: [], photoBlob: null, photoChanged: false, canvas: null, detected: []});
      typeErr = colorErr = false;
      renderType(); renderColor(); renderPat(); renderStyle(); renderName(); renderFoot(); sh.body.scrollTop = 0;
      const next = queue.shift(); updateTitle(); renderFoot(); await loadFile(next); renderFoot();
      render(); return;
    }
    closeSheet(); render();
    toast(removed ? 'Guardada. Quitamos las prendas de ejemplo.' : (editing ? 'Cambios guardados.' : 'Guardada: ' + itemName(it)));
  }
  renderPhoto(); renderType(); renderColor(); renderPat(); renderStyle(); renderName(); renderExtra(); renderFoot();
  if (!editing && queue.length){ const f = queue.shift(); updateTitle(); loadFile(f); }
  if (editing && d.photoBlob) canvasFromBlob(d.photoBlob, 900).then(cv => { d.canvas = cv; }).catch(() => {});
}

function lookCard(L, opts){
  const o = L.o;
  const card = h('article', {class: 'look'});
  const board = h('div', {class: 'board'});
  const mkTile = (it, slot, extraCls, accIdx) => {
    const b = h('button', {class: 'tile' + (extraCls ? ' ' + extraCls : ''), type: 'button', 'aria-label': 'Cambiar ' + itemName(it), title: itemName(it)});
    const u = photoURL(it);
    if (u) b.append(h('img', {src: u, alt: ''})); else b.innerHTML = garmentSVG(it.type, (PAL[it.color] || PAL.gris).hex, it.pattern);
    if (opts.readonly) b.disabled = true;
    else b.addEventListener('click', () => { const nl = swapIn(L, slot, accIdx); if (nl){ nl.ai = null; card.replaceWith(lookCard(nl, opts)); } });
    return b;
  };
  const main = h('div', {class: 'col'}), side = h('div', {class: 'col'});
  if (o.dress) main.append(mkTile(o.dress, 'dress', 'tall'));
  else { main.append(mkTile(o.top, 'top')); main.append(mkTile(o.bottom, 'bottom')); }
  if (o.outer) side.append(mkTile(o.outer, 'outer'));
  else if (!opts.readonly && (L.ctx.w !== 'calor' || L.ctx.t >= 3) && state.items.some(it => TYPES[it.type].slot === 'outer' && formDist(it, L.ctx.t) <= 1 && weatherPen(it, L.ctx.w) < 14)){
    const addB = h('button', {class: 'tile add', type: 'button', 'aria-label': 'Probar con una capa'}, icon('plus'), 'Capa');
    addB.addEventListener('click', () => { const nl = swapIn(L, 'outer'); if (nl) card.replaceWith(lookCard(nl, opts)); });
    side.append(addB);
  }
  if (o.shoes) side.append(mkTile(o.shoes, 'shoes'));
  if (o.acc && o.acc.length) side.append(h('div', {class: 'accs'}, o.acc.map((a, i) => mkTile(a, 'acc', null, i))));
  board.append(main, side);

  const all = [o.outer, o.top, o.dress, o.bottom, o.shoes].concat(o.acc || []).filter(Boolean);
  const cols = [...new Set(all.map(i => i.color))];
  const body = h('div', {class: 'look-body'});
  body.append(h('div', {class: 'look-top'},
    h('div', {style: 'min-width:0'}, h('h3', {class: 'look-title'}, L.ai ? L.ai.title : L.title),
      h('div', {class: 'swatches look-sub', 'aria-label': 'Colores: ' + cols.map(cn).join(', ')}, cols.map(k => h('i', {style: 'background:' + PAL[k].hex, title: PAL[k].n})))),
    h('div', {class: 'nota', 'aria-label': 'Nota ' + fmt1(L.nota) + ' de 10'}, h('b', null, fmt1(L.nota)), h('span', null, notaLabel(L.nota)))));
  if (L.ai){
    body.append(h('p', {class: 'ai-why'}, L.ai.why));
    if (L.ai.tips && L.ai.tips.length) body.append(h('div', {class: 'tip'}, h('p', {class: 'eyebrow'}, 'Consejo del estilista'), L.ai.tips.map(t => h('p', null, t))));
  } else {
    const ul = h('ul', {class: 'reasons'});
    L.good.forEach(t => ul.append(h('li', null, icon('check'), h('span', null, t))));
    L.warn.forEach(t => ul.append(h('li', {class: 'w'}, icon('warn'), h('span', null, t))));
    body.append(ul);
    if (L.tips.length) body.append(h('div', {class: 'tip'}, h('p', {class: 'eyebrow'}, 'Consejo'), L.tips.map(t => h('p', null, t))));
  }
  const actions = h('div', {class: 'look-actions'});
  const saved = state.looks.find(x => x.key === L.key);
  if (opts.savedId){
    actions.append(h('button', {class: 'btn btn-sm', type: 'button', onclick: async () => { await DB.del('looks', opts.savedId); state.looks = state.looks.filter(x => x.id !== opts.savedId); renderCombine(); toast('Quitado de guardados.'); }}, 'Quitar de guardados'));
  } else {
    const sb = h('button', {class: 'btn btn-sm', type: 'button', 'aria-pressed': String(!!saved)}, icon('heart'), saved ? 'Guardado' : 'Guardar');
    if (saved) sb.disabled = true;
    sb.addEventListener('click', async () => {
      const rec = {id: uid(), key: L.key, occ: L.ctx.occ, w: L.ctx.w, created: Date.now(),
        ids: {top: o.top && o.top.id, bottom: o.bottom && o.bottom.id, dress: o.dress && o.dress.id, outer: o.outer && o.outer.id, shoes: o.shoes && o.shoes.id, acc: (o.acc || []).map(a => a.id)}};
      await DB.put('looks', rec); state.looks.push(rec);
      sb.disabled = true; sb.lastChild.textContent = 'Guardado';
      const segBtn = $$('#v-combine .seg button')[1]; if (segBtn) segBtn.textContent = 'Guardados (' + state.looks.length + ')';
      toast('Look guardado.');
    });
    actions.append(sb);
  }
  actions.append(h('button', {class: 'btn btn-sm', type: 'button', onclick: async (e) => {
    const t = todayISO();
    for (const it of all){ if (!it.worn) it.worn = []; if (!it.worn.includes(t)) it.worn.push(t); it.worn = it.worn.slice(-30); await DB.put('items', it); }
    e.currentTarget.disabled = true; toast('¡A lucirlo! Mañana te propondremos otras prendas.');
  }}, icon('calendar'), 'Me lo pongo hoy'));
  body.append(actions);
  if (!opts.readonly) body.append(h('p', {class: 'hint'}, 'Toca una prenda del tablero para cambiarla por otra opción.'));
  card.append(board, body);
  return card;
}

function swapIn(L, slot, accIdx){
  const ctx = L.ctx; const o = Object.assign({}, L.o, {acc: (L.o.acc || []).slice()});
  const tried = Object.assign({}, L.tried || {});
  const key = slot === 'acc' ? 'acc' + accIdx : slot;
  const fixed = L.fixed;
  if (fixed && ((slot !== 'acc' && TYPES[fixed.type].slot === slot) || (slot === 'acc' && o.acc[accIdx] === fixed))){ toast('Esa es la prenda que elegiste combinar.'); return null; }
  let set = new Set(tried[key] || []);
  if (slot === 'acc'){
    const cur = o.acc[accIdx]; const sub = TYPES[cur.type].sub; set.add(cur.id);
    const others = o.acc.filter((_, i) => i !== accIdx);
    const base = Object.assign({}, o, {acc: others});
    const rank = s2 => state.items.filter(it => TYPES[it.type].slot === 'acc' && TYPES[it.type].sub === sub && !o.acc.includes(it) && !s2.has(it.id))
      .map(it => ({it, v: accScore(it, base, ctx, others, null)})).filter(x => x.v > -50).sort((a, b) => b.v - a.v);
    let opts = rank(set);
    let next;
    if (opts.length) next = opts[0].it;
    else if (!set.has('none')){ next = null; set.add('none'); }
    else { set = new Set([cur.id]); opts = rank(set); if (!opts.length){ next = null; } else next = opts[0].it; }
    if (next){ set.add(next.id); o.acc[accIdx] = next; } else o.acc.splice(accIdx, 1);
    if (!next) toast('Quitamos ' + art(TYPES[cur.type]) + ' ' + tn(TYPES[cur.type]) + '.');
  } else {
    const cur = o[slot]; set.add(cur ? cur.id : 'none');
    const rank = s2 => {
      const list = state.items.filter(it => TYPES[it.type].slot === slot && !s2.has(it.id) && formDist(it, ctx.t) <= 1 && weatherPen(it, ctx.w) < 14)
        .map(it => { const o2 = Object.assign({}, o, {[slot]: it}); return {it, s: scoreCore(o2, ctx, null)}; });
      if (slot === 'outer' && cur && !s2.has('none')) list.push({it: null, s: scoreCore(Object.assign({}, o, {outer: null}), ctx, null)});
      return list.sort((a, b) => b.s - a.s);
    };
    let opts = rank(set);
    if (!opts.length){ set = new Set([cur ? cur.id : 'none']); opts = rank(set); }
    if (!opts.length){ toast('No hay otra opción para esta pieza con la ocasión elegida.'); return null; }
    const pick = opts[0]; set.add(pick.it ? pick.it.id : 'none'); o[slot] = pick.it;
    const forced = fixed && TYPES[fixed.type].slot === 'acc' ? fixed : null;
    const accs = poolFor(ctx, forced, 0).acc;
    addAccessories(o, ctx, accs, forced);
  }
  tried[key] = [...set];
  const nl = finalize(o, ctx); nl.tried = tried; nl.fixed = fixed; return nl;
}

function renderSaved(v){
  const list = h('div', {class: 'looks'});
  const byId = new Map(state.items.map(i => [i.id, i]));
  const valid = [];
  state.looks.slice().sort((a, b) => b.created - a.created).forEach(rec => {
    const g = id => id ? byId.get(id) || null : null;
    const o = {top: g(rec.ids.top), bottom: g(rec.ids.bottom), dress: g(rec.ids.dress), outer: g(rec.ids.outer), shoes: g(rec.ids.shoes), acc: (rec.ids.acc || []).map(g).filter(Boolean)};
    if (!(o.dress || (o.top && o.bottom))) return;
    const L = finalize(o, mkCtx(rec.occ in OCC ? rec.occ : 'casual', rec.w in WEA ? rec.w : 'templado'));
    valid.push(lookCard(L, {readonly: true, savedId: rec.id}));
  });
  if (!valid.length){
    v.append(h('div', {class: 'empty'}, icon('heart', 'big'), h('h3', null, 'Sin looks guardados'), h('p', null, 'Cuando un look te guste, toca «Guardar» y lo tendrás aquí para repetirlo.'))); return;
  }
  valid.forEach(c => list.append(c));
  v.append(list);
}

/* ---------- Estilista con IA (solo dentro de Claude) ---------- */
const AI_ERR = {
  rate_limited: 'Demasiadas consultas seguidas. Espera un momento y vuelve a intentarlo.',
  session_expired: 'Tu sesión expiró. Vuelve a iniciar sesión en Claude.',
  image_rejected: 'No se pudo usar esa foto. Prueba con otra.',
  refused: 'No se pudo responder a esa petición. Prueba a describirla de otra forma.',
  invalid_json: 'La respuesta no salió completa. Intenta de nuevo.',
  empty_completion: 'No hubo respuesta. Intenta de nuevo.',
  upstream_error: 'Hubo un problema de conexión. Intenta de nuevo.'
};
const AI_OFF = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'];
function aiFail(e, quiet){
  const code = e && e.code;
  if (code === 'cancelled') return;
  if (AI_OFF.includes(code)){
    if (code === 'images_unavailable') state.ai.images = false; else state.ai.sample = null;
    if (!quiet) toast('La IA no está disponible aquí; el motor de estilo sigue funcionando.');
    return;
  }
  toast(AI_ERR[code] || AI_ERR.upstream_error);
}
async function aiAutofill(d){
  if (!state.ai.sample || !d.photoBlob) return false;
  const types = Object.keys(TYPES).map(k => k + ' = ' + (TYPES[k].pick || TYPES[k].n)).join('; ');
  const cols = PALETTE.map(c => c.k + ' = ' + c.n).join('; ');
  const prompt = 'Mira la foto: es una prenda o accesorio que alguien quiere registrar en su clóset digital. Identifica la pieza principal.\n' +
    'Responde SOLO con un objeto JSON así: {"tipo":"camisa","color":"celeste","estampado":"liso","estilo":0,"temporada":"all","nombre":"Camisa Oxford celeste"}\n' +
    '- tipo: una de estas claves: ' + types + '\n' +
    '- color: el color principal, una de estas claves: ' + cols + '\n' +
    '- estampado: liso, rayas, cuadros, lunares, floral, animal o estampado\n' +
    '- estilo: -1 si es más casual de lo normal para su tipo, 1 si es más formal, 0 si es lo normal\n' +
    '- temporada: "all", "hot" (solo para calor) o "cold" (solo para frío)\n' +
    '- nombre: nombre corto en español, máximo 4 palabras';
  try {
    const r = await state.ai.sample.json(prompt, {images: [d.photoBlob], modelTier: 'quick'});
    if (!r || typeof r !== 'object') throw {code: 'invalid_json'};
    if (TYPES[r.tipo]){ d.type = r.tipo; d.season = TYPES[r.tipo].season || 'all'; }
    if (PAL[r.color]) d.color = r.color;
    if (PAT[r.estampado]) d.pattern = r.estampado;
    if ([-1, 0, 1].includes(Number(r.estilo))) d.shift = Number(r.estilo);
    if (SEA[r.temporada]) d.season = r.temporada;
    if (typeof r.nombre === 'string' && r.nombre.trim()) d.name = r.nombre.trim().slice(0, 60);
    return true;
  } catch (e){ aiFail(e); return false; }
}
function stylistBox(){
  const box = h('div', {class: 'stylist'});
  const inp = h('input', {class: 'input', id: 'stylist-q', type: 'text', maxlength: '200', placeholder: 'Ej.: boda en la playa de día', autocomplete: 'off'});
  const btn = h('button', {class: 'btn btn-ink', type: 'submit'}, icon('spark'), 'Preguntar');
  const res = h('div');
  const form = h('form', null, inp, btn);
  let ctl = null;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const q = inp.value.trim(); if (!q){ inp.focus(); return; }
    if (!state.items.length){ toast('Primero agrega algunas prendas.'); return; }
    ctl = new AbortController();
    btn.disabled = true;
    res.innerHTML = ''; res.append(h('div', {class: 'thinking'}, h('span', {class: 'spin'}), 'El estilista está revisando tu clóset…',
      h('button', {class: 'link', type: 'button', onclick: () => ctl && ctl.abort()}, 'Detener')));
    try {
      const L = await askStylist(q, ctl.signal);
      res.innerHTML = '';
      if (L) res.append(lookCard(L, {})); else res.append(h('p', {class: 'small muted'}, 'El estilista no encontró una combinación válida con tu clóset para eso. Prueba a describirlo de otra forma.'));
    } catch (err){ res.innerHTML = ''; aiFail(err); if (!state.ai.sample) box.remove(); }
    btn.disabled = false;
  });
  box.append(h('div', null, h('p', {class: 'eyebrow'}, 'Estilista con IA'), h('h3', null, 'Cuéntale a dónde vas')), form, res);
  return box;
}
async function askStylist(q, signal){
  const ctx = mkCtx(state.set.occ, state.set.w);
  const items = state.items.slice(0, 160).map(it => [it.id, itemName(it), TYPES[it.type].pick || TYPES[it.type].n, PAL[it.color].n, PAT[it.pattern || 'liso'], 'formalidad ' + itemRange(it).join('-'), SEA[seasonOf(it)]].join(' | ')).join('\n');
  const prompt = 'Eres un estilista experto en elegancia y buen gusto. Arma UN solo look con prendas de este clóset para la situación que te describen.\n' +
    'Situación: ' + q + '\nClima: ' + WEA[ctx.w] + '. Perfil: ' + PROF[state.set.profile || 't'] + '.\n' +
    'Reglas: usa solo ids de la lista; elige una prenda de arriba y una de abajo, o un vestido/enterizo; agrega calzado si hay; una capa si conviene; máximo 3 accesorios. Cuida la armonía de color (máximo 3 colores, con neutros de base), la formalidad coherente y un solo estampado.\n' +
    'Clóset (id | nombre | tipo | color | estampado | formalidad de 1 a 5 | temporada):\n' + items + '\n' +
    'Responde SOLO con JSON: {"titulo":"máximo 5 palabras","ids":["id1","id2"],"por_que":"2 o 3 frases en español, cálidas y concretas","consejos":["1 o 2 consejos breves"]}';
  const r = await state.ai.sample.json(prompt, {cache: false, signal});
  if (!r || !Array.isArray(r.ids)) throw {code: 'invalid_json'};
  const byId = new Map(state.items.map(i => [i.id, i]));
  const o = {top: null, bottom: null, dress: null, outer: null, shoes: null, acc: []};
  r.ids.forEach(id => { const it = byId.get(String(id)); if (!it) return; const sl = TYPES[it.type].slot; if (sl === 'acc'){ if (o.acc.length < 3 && !o.acc.includes(it)) o.acc.push(it); } else if (!o[sl]) o[sl] = it; });
  if (o.dress){ o.top = null; o.bottom = null; }
  if (!(o.dress || (o.top && o.bottom))) return null;
  const L = finalize(o, ctx);
  L.ai = {title: String(r.titulo || L.title).slice(0, 60), why: String(r.por_que || ''), tips: Array.isArray(r.consejos) ? r.consejos.map(String).slice(0, 2) : []};
  return L;
}
