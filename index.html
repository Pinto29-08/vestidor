function renderIdeas(){
  const v = $('#v-ideas'); v.innerHTML = '';
  v.append(h('div', {class: 'v-head'}, h('div', null, h('p', {class: 'eyebrow'}, 'Análisis de tu clóset · clima ' + WEA[state.set.w].toLowerCase()), h('h2', null, 'Ideas para tu estilo'))));
  if (state.items.length < 3){
    v.append(h('div', {class: 'empty'}, icon('spark', 'big'), h('h3', null, 'Necesitamos más ropa'), h('p', null, 'Agrega al menos tres prendas para analizar tu clóset y recomendarte compras inteligentes.')));
    v.append(rulesSection()); return;
  }
  if (state.ideas && !state.ideasDirty){ drawIdeas(v, state.ideas); return; }
  const wait = h('div', {class: 'thinking'}, h('span', {class: 'spin'}), 'Analizando tu clóset…');
  v.append(wait);
  computeIdeas().then(res => { state.ideas = res; state.ideasDirty = false; if (state.view === 'ideas') { v.innerHTML = ''; v.append(h('div', {class: 'v-head'}, h('div', null, h('p', {class: 'eyebrow'}, 'Análisis de tu clóset · clima ' + WEA[state.set.w].toLowerCase()), h('h2', null, 'Ideas para tu estilo')))); drawIdeas(v, res); } });
}
async function computeIdeas(){
  const occs = ['casual','oficina','cita','fiesta','formal'];
  const w = state.set.w; const per = {}; let total = 0;
  for (const occ of occs){ per[occ] = countGood(mkCtx(occ, w), null, 400); total += per[occ]; await tick(); }
  const prof = state.set.profile || 't';
  const cands = (ESS[prof] || ESS.t).filter(c => !state.items.some(it => it.type === c[0] && (it.color === c[1] || dE(PAL[it.color].lab, PAL[c[1]].lab) < 12)));
  const gains = [];
  for (const c of cands){
    const it = {id: 'v_' + c[0] + '_' + c[1], type: c[0], color: c[1], pattern: 'liso', shift: 0, season: TYPES[c[0]].season || 'all', virtual: true};
    let g = 0; for (const occ of occs) g += countGood(mkCtx(occ, w), it, 160);
    gains.push({c, it, g}); await tick();
  }
  gains.sort((a, b) => b.g - a.g);
  const lonely = [];
  const own = state.items.filter(i => !i.sample);
  const pool = (own.length ? own : state.items).filter(i => TYPES[i.type].slot !== 'acc').slice(0, 40);
  for (const it of pool){
    let n = 0;
    for (const occ of occs){ if (formDist(it, OCC[occ].t) > 1) continue; n += countGood(mkCtx(occ, w), it, 60); if (n) break; }
    if (!n) lonely.push(it);
    await tick();
  }
  return {per, total, gains: gains.filter(x => x.g > 0).slice(0, 5), lonely: lonely.slice(0, 8)};
}
function drawIdeas(v, res){
  const sec1 = h('div', {class: 'sec'},
    h('div', {class: 'stat'}, h('span', {class: 'big'}, res.total.toLocaleString('es')), h('p', null, 'looks bien combinados (nota 7 o más) puedes armar hoy con lo que tienes.')),
    h('div', {class: 'occ-tbl'}, Object.keys(res.per).map(k => h('div', null, h('b', null, res.per[k].toLocaleString('es')), h('span', null, OCC[k].n)))));
  v.append(sec1);

  const sec2 = h('div', {class: 'sec'}, h('h2', null, 'Compras que más te rinden'),
    h('p', {class: 'muted small'}, 'Simulamos cada básico en tu clóset y contamos cuántos looks nuevos abriría. Compra pocas cosas, pero que sumen.'));
  if (res.gains.length){
    sec2.append(h('div', {class: 'buys'}, res.gains.map(x => h('div', {class: 'buy'}, thumb(x.it, 'g-img'),
      h('div', {style: 'min-width:0'}, h('b', null, autoName(x.it)), h('p', null, x.c[2])),
      h('span', {class: 'badge'}, '+' + x.g + (x.g === 1 ? ' look' : ' looks'))))));
  } else sec2.append(h('div', {class: 'note'}, h('p', {class: 'small'}, 'Tu clóset ya tiene los básicos que más rinden. Para crecer, busca piezas con personalidad que combinen con tus neutros.')));
  v.append(sec2);

  const counts = {}; state.items.forEach(i => { counts[i.color] = (counts[i.color] || 0) + 1; });
  const tot = state.items.length;
  const neutral = state.items.filter(i => !isChromK(i.color)).length / tot;
  const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const msg = neutral >= 0.7 ? 'Tu clóset es mayormente neutro: muy versátil. Una o dos piezas de color le darían más personalidad.'
    : neutral >= 0.4 ? 'Buen equilibrio entre neutros y color: tienes base y personalidad.'
    : 'Tienes muchos colores. Suma neutros (blanco, negro, marino, beige) para poder combinarlos entre sí.';
  v.append(h('div', {class: 'sec'}, h('h2', null, 'Tu paleta'), h('p', null, msg),
    h('div', {class: 'palette-bar', role: 'img', 'aria-label': 'Proporción de colores en tu clóset'}, order.map(k => h('i', {style: `flex:${counts[k]};background:${PAL[k].hex}`, title: PAL[k].n + ': ' + counts[k]}))),
    h('div', {class: 'legend'}, order.slice(0, 8).map(k => h('span', null, h('i', {class: 'dot', style: 'background:' + PAL[k].hex}), PAL[k].n + ' · ' + counts[k])))));

  if (res.lonely.length){
    v.append(h('div', {class: 'sec'}, h('h2', null, 'Piden compañía'),
      h('p', {class: 'muted small'}, 'Estas prendas todavía no forman ningún look bien combinado con tu clima. Suele ayudar sumar neutros o una capa.'),
      h('div', {class: 'mini-grid'}, res.lonely.map(it => h('button', {class: 'g-card', type: 'button', onclick: () => openItemSheet(it)}, thumb(it), h('span', {class: 'g-name'}, itemName(it)))))));
  }
  v.append(rulesSection());
}
function rulesSection(){
  const R = [
    ['Base neutra, un acento', 'Máximo tres colores por look. Negro, blanco, gris, marino, beige, camel y mezclilla no cuentan: son el lienzo.', ['negro','blanco','marino','azul']],
    ['Un solo protagonista', 'Un estampado a la vez; lo demás, liso. Si mezclas, que uno sea grande y el otro fino.', null],
    ['Cinturón igual a zapatos', 'Mismo tono de cuero: negro con negro, café con café. Es el detalle que delata el buen gusto.', ['cafe','cafe','negro','negro']],
    ['Formalidad pareja', 'Todas las piezas al mismo nivel. La excepción elegante: un blazer sobre algo casual.', null],
    ['Contraste o tono sobre tono', 'Juega con claro y oscuro, o ve monocromo. Evita tonos casi iguales, como negro con marino.', ['gris_claro','carbon','camel','cafe']],
    ['Zapatos más oscuros', 'En lo formal, el zapato va más oscuro que el pantalón.', null],
    ['Un solo metal', 'Dorado o plateado, no ambos en joyas y hebillas.', ['dorado','plateado']],
    ['Menos es más', 'Antes de salir, quítate un accesorio. Y recuerda: la talla correcta luce más que la marca.', null]
  ];
  return h('div', {class: 'sec'}, h('h2', null, 'Reglas de oro'), h('div', {class: 'rules'}, R.map(r => h('div', {class: 'rule'},
    r[2] ? h('div', {class: 'sws', 'aria-hidden': 'true'}, r[2].map(k => h('i', {style: 'background:' + PAL[k].hex}))) : null,
    h('h3', null, r[0]), h('p', null, r[1])))));
}

/* ---------- Vista: Ajustes ---------- */
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function renderSettings(){
  const v = $('#v-settings'); v.innerHTML = '';
  v.append(h('div', {class: 'v-head'}, h('div', null, h('p', {class: 'eyebrow'}, 'Preferencias'), h('h2', null, 'Ajustes'))));
  v.append(h('div', {class: 'sec'}, h('h2', null, 'Para quién'), h('p', {class: 'muted small'}, 'Ajusta las categorías, los ejemplos y las recomendaciones de compra.'),
    seg([['h','Hombre'],['m','Mujer'],['t','Ambos']], state.set.profile || 't', p => setProfile(p).then(renderSettings), 'Perfil')));

  const inst = h('div', {class: 'sec'}, h('h2', null, 'Instalar en tu teléfono'));
  if (isStandalone()) inst.append(h('p', null, 'Vestidor ya está instalada en este dispositivo.'));
  else {
    if (!PWA) inst.append(h('p', {class: 'small muted'}, 'Esta es la versión de prueba. Para instalarla como app, abre la versión publicada de Vestidor en el navegador de tu teléfono y sigue estos pasos.'));
    if (state.installEvt) inst.append(h('button', {class: 'btn btn-primary', type: 'button', onclick: async () => { const e = state.installEvt; state.installEvt = null; e.prompt(); try { await e.userChoice; } catch (x){} renderSettings(); }}, icon('download'), 'Instalar Vestidor'));
    inst.append(h('div', {class: 'note'}, h('p', {class: 'eyebrow'}, 'iPhone'), h('ol', {class: 'steps'},
      h('li', null, 'Abre Vestidor en Safari.'), h('li', null, 'Toca el botón Compartir (el cuadro con la flecha hacia arriba).'),
      h('li', null, 'Elige «Agregar a pantalla de inicio» y toca «Agregar».'), h('li', null, 'Abre Vestidor desde su ícono: funciona a pantalla completa y sin conexión.'))));
    inst.append(h('div', {class: 'note'}, h('p', {class: 'eyebrow'}, 'Android'), h('ol', {class: 'steps'},
      h('li', null, 'Abre Vestidor en Chrome.'), h('li', null, 'Toca el menú ⋮ y elige «Instalar aplicación» o «Agregar a la pantalla principal».'))));
  }
  v.append(inst);

  const bk = h('div', {class: 'sec'}, h('h2', null, 'Respaldo'),
    h('p', {class: 'muted small'}, 'Tus fotos se guardan solo en este dispositivo. Exporta una copia para pasarla a otro teléfono o por si cambias de equipo.'),
    h('div', {style: 'display:flex;gap:8px;flex-wrap:wrap'},
      h('button', {class: 'btn', type: 'button', onclick: exportBackup}, icon('download'), 'Exportar copia'),
      h('button', {class: 'btn', type: 'button', onclick: () => $('#import-input').click()}, icon('upload'), 'Importar copia')));
  v.append(bk);

  const ex = h('div', {class: 'sec'}, h('h2', null, 'Ejemplos'));
  if (hasSamples()) ex.append(h('button', {class: 'btn', type: 'button', onclick: async () => { await removeSamples(); renderSettings(); toast('Quitamos las prendas de ejemplo.'); }}, 'Quitar prendas de ejemplo'));
  else ex.append(h('p', {class: 'muted small'}, 'Carga un clóset de ejemplo para ver cómo funciona; se borra al guardar tu primera prenda nueva.'),
    h('button', {class: 'btn', type: 'button', onclick: async () => { await seedSamples(state.set.profile || 't'); renderSettings(); toast('Clóset de ejemplo cargado.'); }}, 'Cargar ejemplos'));
  v.append(ex);

  let armed = false;
  const delBtn = h('button', {class: 'btn btn-danger', type: 'button'}, 'Borrar todo');
  delBtn.addEventListener('click', async () => {
    if (!armed){ armed = true; delBtn.classList.add('armed'); delBtn.textContent = 'Sí, borrar todas mis prendas y looks'; setTimeout(() => { if (armed){ armed = false; delBtn.classList.remove('armed'); delBtn.textContent = 'Borrar todo'; } }, 5000); return; }
    await DB.clear('items'); await DB.clear('looks'); state.urls.forEach(u => URL.revokeObjectURL(u)); state.urls.clear();
    state.items = []; state.looks = []; state.fixed = null; markDirty(); renderSettings(); toast('Se borró todo.');
  });
  v.append(h('div', {class: 'sec'}, h('h2', null, 'Borrar datos'), h('p', {class: 'muted small'}, 'Elimina todas tus prendas, fotos y looks guardados de este dispositivo. No se puede deshacer.'), h('div', null, delBtn)));
  v.append(h('p', {class: 'small muted'}, (DB.ok ? 'Guardado en este dispositivo.' : 'Este navegador no permite guardar datos; se perderán al cerrar.') + ' Vestidor funciona sin conexión y no envía tus fotos a ningún servidor' + (state.ai.sample ? ', salvo cuando tú usas el estilista con IA.' : '.')));
}

async function exportBackup(){
  const toDataURL = (buf, type) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(new Blob([buf], {type: type || 'image/jpeg'})); });
  const own = state.items.filter(i => !i.sample);
  if (!own.length){ toast('Aún no tienes prendas propias para respaldar.'); return; }
  const items = [];
  for (const it of own){ const c = Object.assign({}, it); delete c.photo; c.photo = it.photo ? await toDataURL(it.photo, it.photoType) : null; items.push(c); }
  const data = JSON.stringify({app: 'vestidor', version: 1, exported: new Date().toISOString(), profile: state.set.profile, items, looks: state.looks});
  const filename = 'vestidor-respaldo-' + todayISO() + '.json';
  if (state.ai.downloads){
    try { await state.ai.downloads.save({filename, data}); toast('Copia lista.'); return; }
    catch (e){ if (e && e.code === 'declined') return; }
  }
  try {
    const file = new File([data], filename, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: 'Respaldo de Vestidor'}); return; }
  } catch (e){ if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
  const a = h('a', {href: url, download: filename}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$('#import-input').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== 'vestidor' || !Array.isArray(data.items)) throw new Error('formato');
    let n = 0;
    const hadSamples = hasSamples();
    if (hadSamples) await removeSamples();
    for (const raw of data.items){
      if (!raw || !TYPES[raw.type] || !PAL[raw.color]) continue;
      const it = {id: String(raw.id || uid()), type: raw.type, color: raw.color, pattern: PAT[raw.pattern] ? raw.pattern : 'liso', shift: [-1,0,1].includes(raw.shift) ? raw.shift : 0,
        season: SEA[raw.season] ? raw.season : (TYPES[raw.type].season || 'all'), name: typeof raw.name === 'string' ? raw.name.slice(0, 60) : '', created: Number(raw.created) || Date.now(),
        worn: Array.isArray(raw.worn) ? raw.worn.filter(x => /^\d{4}-\d\d-\d\d$/.test(x)).slice(-30) : [], sample: false};
      if (typeof raw.photo === 'string' && raw.photo.startsWith('data:image/')){ const b = dataURLtoBlob(raw.photo); it.photo = await blobToBuf(b); it.photoType = b.type || 'image/jpeg'; }
      dropURL(it.id); await DB.put('items', it);
      const i = state.items.findIndex(x => x.id === it.id); if (i >= 0) state.items[i] = it; else state.items.push(it);
      n++;
    }
    if (Array.isArray(data.looks)) for (const l of data.looks){ if (l && l.id && l.ids){ await DB.put('looks', l); if (!state.looks.some(x => x.id === l.id)) state.looks.push(l); } }
    if (data.profile && PROF[data.profile] && !state.set.profile){ state.set.profile = data.profile; saveSettings(); }
    markDirty(); render(); toast('Importadas ' + n + ' prendas.');
  } catch (err){ toast('Ese archivo no es una copia de Vestidor válida.'); }
});

/* ---------- Arranque ---------- */
async function initAI(){
  if (PWA || !window.claude || typeof window.claude.use !== 'function') return;
  try {
    const s = await window.claude.use('sample');
    if (typeof s === 'function'){
      state.ai.sample = s;
      try { const lim = await s.limits(); state.ai.images = !!(lim && lim.images); } catch (e){}
      if (state.view === 'combine') renderCombine();
    }
  } catch (e){}
  try { const d = await window.claude.use('downloads'); if (d) state.ai.downloads = d; } catch (e){}
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); state.installEvt = e; if (state.view === 'settings') renderSettings(); });

async function boot(){
  const fecha = new Intl.DateTimeFormat('es', {weekday: 'long', day: 'numeric', month: 'long'}).format(new Date());
  $('#issue').textContent = cap(fecha);
  await DB.open();
  state.items = (await DB.all('items')).filter(it => it && TYPES[it.type] && PAL[it.color]);
  state.looks = (await DB.all('looks')).filter(l => l && l.ids);
  if (!state.items.length && !state.set.seeded) await seedSamples(state.set.profile || 't');
  if (!OCC[state.set.occ]) state.set.occ = 'casual';
  if (!WEA[state.set.w]) state.set.w = 'calor';
  const hv = (location.hash || '').slice(1);
  const map = {closet: 'closet', combinar: 'combine', ideas: 'ideas', ajustes: 'settings'};
  setView(map[hv] || 'closet', true);
  initAI();
  if (PWA && 'serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(() => {}); }
  if (navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
}
boot();
})();
